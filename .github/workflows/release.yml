name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  npm:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing exchanges the GitHub OIDC token for a short-lived publish token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Pack @wheatley-ai/sdk and @wheatley-ai/cli
        run: pnpm --filter @wheatley-ai/sdk --filter @wheatley-ai/cli pack --pack-destination "$RUNNER_TEMP/packages"

      # npm runs outside the repository root, because the root devEngines field accepts only pnpm.
      - name: Publish the tarballs
        working-directory: ${{ runner.temp }}/packages
        run: |
          for tarball in wheatley-ai-sdk-*.tgz wheatley-ai-cli-*.tgz; do
            npm publish "$tarball"
          done

  aur:
    name: Publish to the AUR
    # The PKGBUILD downloads the tarball from registry.npmjs.org, so the npm job must finish first.
    needs: [release-please, npm]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel@sha256:949ecb1661609ab7e8f6854ba03efd62792e7a796313738e94b040c095c20d91
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: packaging/aur
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      AUR_USERNAME: ${{ vars.AUR_USERNAME }}
      AUR_EMAIL: ${{ vars.AUR_EMAIL }}
    steps:
      - name: Install the build tools
        working-directory: /
        run: pacman -Syu --noconfirm --needed git nodejs npm openssh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set the version, checksum, and maintainer in the PKGBUILD
        run: |
          version="${TAG_NAME#v}"
          tarball="cli-${version}.tgz"
          curl --fail --silent --show-error --location --retry 10 --retry-delay 30 --retry-all-errors \
            --output "$tarball" "https://registry.npmjs.org/@wheatley-ai/cli/-/${tarball}"
          checksum="$(sha256sum "$tarball" | cut -d ' ' -f 1)"
          sed -i \
            -e "s|^# Maintainer: .*|# Maintainer: ${AUR_USERNAME} <${AUR_EMAIL}>|" \
            -e "s|^pkgver=.*|pkgver=${version}|" \
            -e "s|^pkgrel=.*|pkgrel=1|" \
            -e "s|^sha256sums=.*|sha256sums=('${checksum}')|" \
            PKGBUILD

      # makepkg refuses to run as root.
      - name: Build the package and regenerate .SRCINFO
        run: |
          useradd --create-home builder
          chown -R builder .
          su builder -c 'makepkg --noconfirm'
          su builder -c 'makepkg --printsrcinfo' > .SRCINFO

      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          ssh_dir="$RUNNER_TEMP/aur-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/id"
          chmod 600 "$ssh_dir/id"
          # The ed25519 host key of aur.archlinux.org, fingerprint SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4.
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/id -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"

          repo="$RUNNER_TEMP/aur-repo"
          git clone ssh://aur@aur.archlinux.org/wheatley-cli.git "$repo"
          cp PKGBUILD .SRCINFO "$repo/"
          cd "$repo"
          git config user.name "$AUR_USERNAME"
          git config user.email "$AUR_EMAIL"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "The AUR package is already at ${TAG_NAME#v}."
            exit 0
          fi
          git commit --message "Update to ${TAG_NAME#v}"
          git push origin HEAD:master

  docker:
    name: Publish to GitHub Container Registry
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/sphericalkat/wheatley
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
