name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  npm:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing exchanges the GitHub OIDC token for a short-lived publish token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Pack @wheatley-ai/sdk and @wheatley-ai/cli
        run: pnpm --filter @wheatley-ai/sdk --filter @wheatley-ai/cli pack --pack-destination "$RUNNER_TEMP/packages"

      # npm runs outside the repository root, because the root devEngines field accepts only pnpm.
      - name: Publish the tarballs
        working-directory: ${{ runner.temp }}/packages
        run: |
          for tarball in wheatley-ai-sdk-*.tgz wheatley-ai-cli-*.tgz; do
            npm publish "$tarball"
          done

  homebrew:
    name: Update the Homebrew formula
    # The formula downloads the npm tarball, so the job waits until npm publishes it.
    needs: [release-please, npm]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SphericalKat/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Render Formula/wheatley.rb
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version="${TAG_NAME#v}"
          formula="$(sed -e "s/@VERSION@/${version}/g" packaging/homebrew/wheatley.rb)"
          url="$(sed -n 's/^  url "\(.*\)"$/\1/p' <<< "$formula")"
          tarball="$RUNNER_TEMP/wheatley-ai-cli-${version}.tgz"
          # The registry can serve a new tarball some time after npm publish returns.
          curl --fail --silent --show-error --location \
            --retry 10 --retry-delay 15 --retry-all-errors \
            --output "$tarball" "$url"
          sha256="$(sha256sum "$tarball" | cut -d ' ' -f 1)"
          mkdir -p homebrew-tap/Formula
          sed -e "s/@SHA256@/${sha256}/g" <<< "$formula" > homebrew-tap/Formula/wheatley.rb
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Push the formula to SphericalKat/homebrew-tap
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/wheatley.rb
          if git diff --cached --quiet; then
            echo "Formula/wheatley.rb already describes ${VERSION}."
            exit 0
          fi
          git commit --message "feat: update wheatley to ${VERSION}"
          git push

  docker:
    name: Publish to GitHub Container Registry
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/sphericalkat/wheatley
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
